name: f5-voices
on:
  workflow_dispatch:
    inputs:
      job:
        description: "folder under jobs/ that holds lines.json"
        required: true
      shards:
        description: "parallel machines (1-20)"
        default: "8"
      takes:
        description: "takes per line (1-3)"
        default: "2"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: echo "idx=$(python3 -c "import json;print(json.dumps(list(range(int('${{ inputs.shards }}')))))")" >> "$GITHUB_OUTPUT"
  voice:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-f5-v1
      - name: Install
        run: |
          which ffmpeg || { pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg as f;print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q git+https://github.com/ai4bharat/IndicF5.git
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers==4.50.0" "datasets==3.2.0" "huggingface_hub==0.30.2" soundfile pydub safetensors
          python -c "import torch,torchaudio;print(torch.__version__,torchaudio.__version__)"
      - name: Voice
        run: python f5_cpu.py jobs/${{ inputs.job }}/lines.json ${{ matrix.shard }} ${{ inputs.shards }} ${{ inputs.takes }} out
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
  merge:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: m
          merge-multiple: true
      - run: ls m | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job }}_voices
          path: m/
