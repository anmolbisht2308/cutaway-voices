name: veena-voices
on:
  workflow_dispatch:
    inputs:
      job:
        description: "folder under jobs/ that holds lines.json"
        required: true
      shards:
        description: "parallel machines (1-20)"
        default: "16"
      takes:
        description: "takes per line (1-3)"
        default: "1"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: echo "idx=$(python3 -c "import json;print(json.dumps(list(range(int('${{ inputs.shards }}')))))")" >> "$GITHUB_OUTPUT"
  voice:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-veena-snac-v1
      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.44,<4.57" accelerate snac soundfile
      - name: Voice
        run: python veena_cpu.py jobs/${{ inputs.job }}/lines.json ${{ matrix.shard }} ${{ inputs.shards }} ${{ inputs.takes }} out
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
  merge:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: m
          merge-multiple: true
      - run: ls m | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job }}_voices
          path: m/
